const SLIDERS = ["figs", "nav", "chips"], ink = el("span", "", "ink");
SLIDERS.forEach(id => {
  const row = $(id), wrap = el("div", "", "slide"), prev = el("button", "‹", "slide-btn prev"), next = el("button", "›", "slide-btn next");
  row.before(wrap); wrap.append(row, prev, next);
  if (id === "nav") wrap.append(ink);
  [prev, next].forEach((b, i) => {
    b.type = "button"; b.tabIndex = -1; b.setAttribute("aria-hidden", "true");
    b.addEventListener("click", e => { e.stopPropagation(); row.scrollBy({ left:(i ? 1 : -1) * row.clientWidth * .7, behavior:"smooth" }); });
  });
  row.addEventListener("scroll", () => { edges(row); if (id === "nav") inkNav(); }, { passive:true });
  row.addEventListener("wheel", e => {               // a mouse wheel scrolls the row sideways
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && row.scrollWidth > row.clientWidth){ row.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive:false });
});
function edges(row){
  const max = row.scrollWidth - row.clientWidth, w = row.parentElement;
  w.classList.toggle("can-prev", max > 2 && row.scrollLeft > 2);
  w.classList.toggle("can-next", max > 2 && row.scrollLeft < max - 2);
}
function inkNav(){
  const nav = $("nav"), a = nav.querySelector("[aria-current]");
  if (!a || nav.offsetParent === null){ ink.style.opacity = 0; return; }
  const pill = phone.matches, left = nav.offsetLeft + a.offsetLeft - nav.scrollLeft;
  Object.assign(ink.style, { opacity:1, left:left + "px", width:a.offsetWidth + "px",
    top:(nav.offsetTop + a.offsetTop + (pill ? 0 : a.offsetHeight + 1)) + "px", height:(pill ? a.offsetHeight : 2) + "px" });
}
function sliders(){ SLIDERS.forEach(id => edges($(id))); requestAnimationFrame(() => { SLIDERS.forEach(id => edges($(id))); inkNav(); }); }
addEventListener("resize", sliders);

    wait:"Aleko is thinking…", caption:"Aleko Konstantinov",
    credit:"Portrait and facts: Wikipedia (CC BY-SA)",
    hello:"Greetings, traveller! I am Aleko. Where does your curiosity lead — to Chicago, to the peaks of Vitosha, or to the pages of my satires?",
    fallback:"A curious question! Let me show you the library — from there, roads lead everywhere.",
    pages:{
      "/library":{nav:"Library",h:"The Library",lead:"Writer, lawyer, public figure — and the man who named himself the Happy Man.",cards:true,
        p:["Aleko Ivanitsov Konstantinov (1863–1897) was a Bulgarian writer, lawyer and public figure, and the founder of the organised tourist movement in Bulgaria. He is best known for his character Bay Ganyo. Choose a door: behind each is a chapter of his short life."]},
      "/early-life":{nav:"Early life",h:"Svishtov, Gabrovo, Nikolaev, Odessa",lead:"A childhood by the Danube and school years in Russia.",
        p:["Aleko was born in Svishtov on 1 January 1863, old style (13 January, new style), in the house of the prominent merchant Ivanitsa Hadzhikonstantinov. On his mother's side he came from the large Shishmanov family of Vidin.",
           "He was taught by the private tutors Emanuil Vaskidovich and Yanko Mustakov, then at the Svishtov school (1872–1874) and the Aprilov High School in Gabrovo (1874–1877). During the Russo-Turkish War, aged just fourteen, he served as a clerk in the office of the governor of Svishtov, Marko Balabanov.",
           "On 14 July 1877 the Russian emperor Alexander II stayed in his father's house and watched from its balcony as the troops crossed the bridge over the Danube. Young Aleko was there, and the memory stayed with him for life.",
           "After the war he boarded at Todor Minkov's South Slavic school and finished high school in Nikolaev in 1881. There he discovered Russian and world literature, made his first attempts at writing, played the violin and even tried composing. That same year he began law at the Novorossiya University in Odessa, graduating in 1885."],
        f:[["1863","Born in Svishtov"],["1874–1877","Aprilov High School, Gabrovo"],["1877","Governor's clerk; Alexander II in his home"],["1881","Finishes school in Nikolaev"],["1885","Graduates in law, Odessa"]]},
      "/public-life":{nav:"Law & society",h:"Judge, lawyer, citizen",lead:"Dismissed twice — for refusing to bend.",
        p:["Back in Bulgaria, Aleko served as a judge (1885–1886), prosecutor (1886) at the Sofia District Court and assistant prosecutor (1886–1888). He was dismissed for opposing political interference in the courts. He became a lawyer, then a judge again at the Sofia Court of Appeal (1890–1892) — and was dismissed again.",
           "For the rest of his life he practised as an independent lawyer in Sofia; in 1896 he was also legal adviser to the city administration. That year he defended a habilitation thesis on the right of pardon under the new penal code, hoping to teach at the Law Faculty of Sofia University.",
           "He took part in a great many civic causes: school trustee, member of the Supreme Macedonian Committee, of the board of the Slavyanska Beseda society, the Society for Popular Education, the Music Society, the Theatre Committee, the Society for the Encouragement of the Arts and the Commission for the Encouragement of Local Industry.",
           "From his student days he admired Petko Karavelov and his ideas of parliamentary democracy. He contributed to the journal Biblioteka \u201cSveti Kliment\u201d, joined the Democratic Party, helped draft its programme and wrote for its newspaper Zname from its founding in 1894."],
        f:[["1885–1888","Judge, prosecutor, assistant prosecutor"],["1890–1892","Judge at the Court of Appeal"],["1894","Writes for the newspaper Zname"],["1896","Thesis on the right of pardon"]]},
      "/chicago":{nav:"Travels",h:"To Chicago and Back",lead:"Paris, Prague, Chicago — three exhibitions and one book.",
        p:["Aleko visited the World Exhibition in Paris (1889), the Jubilee Industrial Exhibition in Prague (1891) and the Columbian Exposition in Chicago (1893), where he also saw Niagara Falls.",
           "His friends urged him to set down his impressions as light, \u201cflying\u201d notes. So in 1893 the travelogue \u201cTo Chicago and Back\u201d was born; it appeared as a book in 1894. It was his first mature work and the first to bring him literary fame.",
           "It is the first Bulgarian travelogue about a journey beyond the country's borders. Aleko looks at America with curiosity but also with measure: he admires its technology and prosperity and is indignant at what is inhumane in a rich, well-ordered society. He laughs at nearly everything, and is serious only before nature, machines and social troubles.",
           "With this book the Bulgarian travelogue stopped being geographical description and became literature. It also stirred a lasting interest in Chicago, today home to the largest Bulgarian community in the United States."],
        f:[["1889","Exhibition in Paris"],["1891","Exhibition in Prague"],["1893","Chicago and Niagara"],["1894","The book appears"]]},
      "/bay-ganyo":{nav:"Bay Ganyo",h:"Bay Ganyo",lead:"Incredible tales of a contemporary Bulgarian.",
        p:["In 1895 Aleko gathered his feuilletons about Bay Ganyo, a small travelling peddler of rose oil out to get rich through trade and politics. Behind the amusing adventures stand the great questions of the day: where Bulgaria is heading, and what is becoming of its manners and morals.",
           "The book is a string of anecdotes told among a bohemian company of friends. Across Europe the hero stumbles into comic situations; he is stingy, arrogant and crude, yet he amuses more than he repels.",
           "In the second part Bay Ganyo returns home and starts \u201cdoing\u201d politics. The laughter fades and gives way to anger and disappointment.",
           "No character has been more debated by Bulgarian critics: is he a national type or a social one? His name has long lived outside the book, in jokes and as a byword. He is believed to be modelled on Ganyo Somov, a tradesman from Karlovo."],
        f:[["1895","The Bay Ganyo feuilletons"],["Hero","A peddler of rose oil"],["Model","Ganyo Somov of Karlovo"]]},
      "/works":{nav:"Works",h:"Feuilletons, travel pieces, translations",lead:"More than forty feuilletons and seven pen names.",
        p:["His first publications were the poems \u201cMirror\u201d (1880) and \u201cWhy?\u201d (1881), printed in the newspapers Tselokupna Bulgaria and Svobodna Bulgaria. In Odessa he wrote the long poem \u201cSong of Slobod-Madzhar and Plamen-Tenya\u201d (1883).",
           "By the end of his life he had written more than 40 feuilletons, most of them prompted by particular events. \u201cHerostratus II\u201d, for instance, answers Prince Ferdinand's attempt to close the Slavyanska Beseda reading room. His themes are trampled voting rights, ministers, deputies and the monarch. In \u201cPassion\u201d and \u201cHappy New Year\u201d he laughs at himself, and in the cycle \u201cVarious People, Various Ideals\u201d he draws lasting human types.",
           "In travel pieces such as \u201cIncredible Indeed, but a Fact…\u201d, \u201cWhat? Switzerland?\u201d and \u201cIn Bulgarian Switzerland\u201d he celebrates Bulgarian nature. In 1894 he published the story \u201cGod Forbid the Blind Should See\u201d. One play survives, \u201cIn the Sphere of Tailcoats and Opera Hats\u201d, about Prince Ferdinand's arrival and the new court ceremonial.",
           "He translated Pushkin (\u201cThe Fountain of Bakhchisarai\u201d, \u201cPoltava\u201d, \u201cThe Gypsies\u201d), Lermontov (\u201cThe Demon\u201d, \u201cThe Fugitive\u201d), Nekrasov, Moli\u00e8re (\u201cTartuffe\u201d), Copp\u00e9e and Sardou. His own works have been translated into about 30 languages.",
           "He signed himself Shtastlivetsa (the Happy Man), Bashibozuk, Benyo Nakov, Evstati Hadzhibalkanski, One of the Moral Influence Club, the Great Warrior and Hanyo. Unfinished stories, drawings and letters are kept in the archive of Professor Petar Dinekov."],
        f:[["1880","\u201cMirror\u201d — first publication"],["40+","feuilletons"],["≈30","languages he is translated into"],["7","pen names"]]},
      "/vitosha":{nav:"Vitosha",h:"Cherni Vrah",lead:"The beginning of organised tourism in Bulgaria.",
        p:["Aleko was famous for his love of nature and travel. On his initiative the first mass ascent of Cherni Vrah took place on 27 August 1895, the day from which organised tourism in Bulgaria is counted.",
           "At the summit a Club of Bulgarian Tourists was founded. The first tourist society, set up in 1899 after his death, took his name.",
           "Today a monument to the Happy Man stands on Cherni Vrah, and the Aleko area and tourist centre on Vitosha carry his name."],
        f:[["1894","Outing to Cherni Vrah with friends"],["1895","First mass ascent, 27 August"],["1899","The Aleko Konstantinov tourist society"]]},
      "/assassination":{nav:"Radilovo",h:"The night near Radilovo",lead:"11 May 1897 (23 May, new style), the feast of Cyril and Methodius.",
        p:["Aleko was travelling with his party colleague Mihail Takev from Peshtera to Pazardzhik. Peshtera was Takev's birthplace and constituency, and the two had been there for the celebrations of Slavic letters. On the way they stopped in the village of Radilovo.",
           "Peshtera and Radilovo had long quarrelled over forests and common pastures, more than once violently. A group of Radilovo men, led by the mayor Petar Minkov of the People's Party, decided to kill Takev.",
           "The coach left Radilovo after ten at night. In the lands of neighbouring Kochagovo, Milosh Topalov and Petar Salepov fired from ambush and killed Aleko. It is told that the two friends had changed places shortly before.",
           "Minkov, Salepov and Topalov were sentenced to death; Salepov, a minor, had his sentence commuted to 15 years in prison. In court they said the target was Takev, though some researchers hold that the ambush was aimed at both men. Aleko was 34. He is buried in the Central Sofia Cemetery, and Kochagovo is now called Aleko Konstantinovo."],
        f:[["1897","Killed in an ambush"],["34","His age"],["Verdict","The three perpetrators sentenced to death"]]},
      "/legacy":{nav:"Legacy",h:"Legacy",lead:"What the Happy Man left behind.",
        p:["His birthplace in Svishtov has been a museum since 1979 and is among Bulgaria's 100 National Tourist Sites. Its furnishings are kept as they were when Alexander II stayed there.",
           "A street in Sofia, Aleko Peak in Rila, a cape on Livingston Island in Antarctica, Aleko's Corner in the Ayazmoto park in Stara Zagora, the Aleko area on Vitosha and the village of Aleko Konstantinovo all carry his name.",
           "His portrait is on the 100 leva banknote of 2003. In Chicago a bust of him stands in the University of Chicago's Regenstein Library, and in 2017 an intersection in the city was named in his honour.",
           "In 2003 the first volume of Gavrail Panchev's three-volume biography of him was published."],
        f:[["1979","House museum in Svishtov"],["2003","The 100 leva banknote"],["2017","Intersection in Chicago"]]}

           "През септември 1865 г. е изключен за „небрежност“ и губи стипендията си. Остава в Одеса, издържа се с частни уроци, записва се като волнослушател в Историко-филологическия факултет на Новорусийския университет и учителства в Бесарабия. Там пише първите си стихове и се сближава с руски и полски революционери."],
        f:[["1848","Роден в Калофер"],["1863","Заминава за Одеса"],["1865","Изключен от гимназията"]]},
      "/exile":{nav:"Емиграция",h:"Калофер, Румъния, Бесарабия",lead:"От учителската катедра до воденицата край Букурещ.",
        p:["През 1867 г. Ботев се връща в Калофер и замества болния си баща като учител; въвежда предмети като география, история и гражданско право. На 15 април същата година в цариградското издание „Гайда“, редактирано от Петко Славейков, излиза без подпис първото му стихотворение — „Майце си“.",
           "На 11 май, на празника на Кирил и Методий, държи неочаквана реч срещу умереността на националното движение, което тогава се бори главно за независима църква. Полицията заплашва, но нищо не последва.",
           "Баща му го изпраща отново в Одеса, но Ботев, без да каже на родителите си, заминава за Румъния и в края на септември 1867 г. пристига в Гюргево. Там бързо намира българските емигранти, сред които Хаджи Димитър. През октомври присъства в Букурещ на погребението на Георги Раковски, а после спира в Браила, където започва работа и печата втората си елегия — „Към брата си“.",
           "Известно време живее в изоставена воденица край Букурещ заедно с Васил Левски и двамата стават близки приятели. От 1869 до 1871 г. отново е учител в Бесарабия, без да прекъсва връзките си с революционното движение."],
        f:[["1867","„Майце си“ — първа публикация"],["1867","Пристига в Гюргево"],["1869–1871","Учител в Бесарабия"]]},
      "/journalism":{nav:"Перо и комитет",h:"Вестници и комитет",lead:"Словото като оръжие.",
        p:["През юни 1871 г. Ботев става редактор на емигрантския вестник „Дума на българските емигранти“, където печата ранните си стихове. Заради връзките си с руски революционери прекарва месеци в затвора. После работи във вестник „Свобода“ на Любен Каравелов, а през 1873 г. редактира сатиричния „Будилник“, чиито фейлетони жилят заможните българи, останали настрана от революционното дело.",
           "В края на 1872 г. османските власти залавят Левски и през февруари 1873 г. го обесват — тежък удар за движението. Българският революционен централен комитет се разделя: Ботев, Стефан Стамболов и Панайот Хитов искат незабавно въстание, а умерените около Каравелов смятат, че е рано. Въстанието в Босна и Херцеговина през 1875 г. засилва убеждението на Ботев, че часът е дошъл.",
           "В началото на август 1875 г. болният Каравелов се оттегля и Ботев е избран за председател на комитета. Същата година се жени за Венета; ражда им се дъщеря Иванка.",
           "По убеждения Ботев е утопичен социалист, повлиян от Херцен, Бакунин, Чернишевски и Парижката комуна; чете и Маркс и Енгелс в руски превод. Заедно с Каравелов е сред най-острите противници на самодържавието. В статия от 1875 г. допуска и турци да участват в революцията редом с българите — защото и едните, и другите страдат от реда на „султаните и капиталистите“."],
        f:[["1871","„Дума на българските емигранти“"],["1873","Сатиричният „Будилник“"],["1875","Председател на БРЦК"]]},
      "/poetry":{nav:"Поезия",h:"Песни и стихотворения",lead:"Двадесет стихотворения, които стигат за безсмъртие.",
        p:["През 1875 г. Ботев издава единствената си стихосбирка — „Песни и стихотворения от Ботьова и Стамболова“, заедно със своя съратник Стефан Стамболов, бъдещия държавник. Тя се смята за едно от най-големите постижения на българската литература.",
           "Стиховете му говорят с гласа на бедните и непокорните, които се борят за свобода срещу тиранията. Сред тях са „Моята молитва“, „На прощаване“, „Хайдути“, „В механата“ и „Борба“, баладата „Хаджи Димитър“, посветена на загиналия му приятел, и „Обесването на Васил Левски“. В „Елегия“ (1870) пита народа кой го люлее в люлката на робството.",

           "В последните си години оставя поезията заради делото. Всичките двадесет стихотворения от книгата са преведени на английски от Томас Бътлър, Питър Темпест и Кристофър Бъкстон."],
        f:[["1870","„Елегия“"],["1875","Единствената стихосбирка"],["20","стихотворения"]]},
      "/radetzky":{nav:"Радецки",h:"„Радецки“ и Врачанският балкан",lead:"Май 1876 г. — от Дунава до Околчица.",
        p:["През Априлското въстание от 1876 г. опитният войвода, поканен да поведе чета от Румъния, отказва и Ботев сам поема командването. Военен ръководител е Никола Войновски. Преди да премине Дунава, Ботев пише, че е весел и радостта му няма граници, защото „Моята молитва“ ще се сбъдне.",
           "Планът е дързък: преоблечени като градинари, четниците се качват на групи на австро-унгарския пътнически параход „Радецки“ от румънските пристанища Зимнич, Турну Мъгуреле, Корабия и Бекет. Щом се качва последната група, те изваждат скритото оръжие и завладяват кораба. Случката по-късно е възпята в песента „Тих бял Дунав се вълнува“.",
           "На българска земя четата почти веднага е нападната от башибозук. На 18 май тя заема позиция на Милин камък, на около 50 км от Дунава. Става ясно, че подкрепа от местното население няма да дойде.",
           "Сутринта на 20 май (1 юни по нов стил) настъпват башибозуци и пет роти редовна османска войска. Отбраната е разделена на два участъка, командвани от Войновски и от Ботев. Вечерта Ботев е застрелян във Врачанския балкан, на 28 години. Не е сигурно дали е паднал на Околчица или на Вола; правителствена комисия през 1901 г. приема Околчица. След смъртта му четата се разпада."],
        f:[["Май 1876","Параходът „Радецки“"],["18 май","Милин камък"],["20 май","Гибелта на Ботев, на 28 години"]]},
      "/legacy":{nav:"Памет",h:"Памет",lead:"Как един поет става икона — и за какво се спори.",
        p:["През 1885 г. е създаден комитет за честване на годишнината от гибелта му, а през 1890 г. на главния площад във Враца, в присъствието на княз Фердинанд, е открит негов паметник. Стефан Стамболов и първият му биограф Захари Стоянов допринасят много за Ботевия образ; за едно десетилетие той става централна фигура в националния пантеон.",

           "Името му носят град Ботевград (от 1934 г.), връх Ботев — най-високият в Стара планина (от 1950 г.), футболни отбори, училища и улици. Родната му къща в Калофер, разрушена през войната от 1877–1878 г., е възстановена през 40-те години като Национален музей „Христо Ботев“. На Околчица има паметник от 1939 г.",
           "Стиховете му се учат в училище и се рецитират на празници. На 2 юни се почита паметта на Ботев и неговите четници, а в класацията „Великите българи“ на БНТ (2006–2007) той е на пето място."],
        f:[["1890","Паметник във Враца"],["1934","Ботевград"],["1950","Връх Ботев"],["2 юни","Ден на Ботев"]]}

  en: {
    kicker:"An interactive library", title:"Hristo Botev",

    credit:"Portrait and facts: Wikipedia (CC BY-SA)",
    hello:"Greetings, brother! I am Hristo Botev. What shall I tell you of — Kalofer, my poems, or the steamer Radetzky?",

    pages:{
      "/library":{nav:"Library",h:"The Library",lead:"Poet, journalist, revolutionary — twenty-eight years that do not fit in one life.",cards:true,
        p:["Hristo Botev (1848–1876), born Hristo Botyov Petkov, was a Bulgarian poet, journalist and revolutionary, and a member of the Bulgarian Revolutionary Central Committee. Choose a door: behind each is a chapter of his short and stormy life."]},
      "/early-life":{nav:"Early life",h:"Kalofer and Odessa",lead:"A teacher's son, an unruly pupil, an insatiable reader.",
        p:["Botev was born on 25 December 1847, old style (6 January 1848, new style), in Kalofer, then in the Ottoman Empire. Some historians dispute the place and point to Karlovo or the village of Osen. His father, Botyo Petkov, was a teacher and a notable figure of the National Revival; his mother Ivanka came from a modest Kalofer family. Hristo grew up with eight brothers and sisters.",
           "In 1854 the family moved to Karlovo, and in 1858 it returned to Kalofer, where Hristo attended the three-class school with his father as his teacher.",
           "In the autumn of 1863, with a scholarship from the Russian government and the help of Nayden Gerov, he left for Odessa, arriving on 14 November. At the Second Grammar School he chafed at the strict discipline, was often absent and quarrelled with classmates and teachers, yet spent long hours in libraries. He read mostly Russian authors, above all Chernyshevsky and Turgenev, and helped the philologist Victor Grigorovich translate Bulgarian folk songs.",
           "In September 1865 he was expelled for “carelessness” and lost his scholarship. He stayed on in Odessa, lived by private tutoring, enrolled as an auditor at the Historical and Philological Faculty of the Novorossiya University and taught in Bessarabia. There he wrote his first poems and grew close to Russian and Polish revolutionaries."],
        f:[["1848","Born in Kalofer"],["1863","Leaves for Odessa"],["1865","Expelled from school"]]},
      "/exile":{nav:"Exile",h:"Kalofer, Romania, Bessarabia",lead:"From the teacher's desk to the mill near Bucharest.",
        p:["In 1867 Botev returned to Kalofer and replaced his ill father as teacher, introducing subjects such as geography, history and civil law. On 15 April that year his first poem, “To My Mother”, appeared unsigned in Gaida, published in Constantinople and edited by Petko Slaveykov.",
           "On 11 May, the feast of Cyril and Methodius, he gave an impromptu speech attacking the moderation of the national movement, which was then focused mainly on an independent church. The police made threats, but nothing came of them.",
           "His father sent him back to Odessa, but Botev, without telling his parents, went to Romania instead and reached Giurgiu at the end of September 1867. There he quickly found the Bulgarian émigrés, among them Hadzhi Dimitar. In October he attended the burial of Georgi Rakovski in Bucharest, then stopped in Brăila, where he found work and published his second elegy, “To My Brother”.",
           "For a time he lived in an abandoned mill near Bucharest together with Vasil Levski, and the two became close friends. From 1869 to 1871 he taught again in Bessarabia, keeping his ties with the revolutionary movement."],
        f:[["1867","“To My Mother” — first publication"],["1867","Arrives in Giurgiu"],["1869–1871","Teacher in Bessarabia"]]},
      "/journalism":{nav:"Pen & committee",h:"Newspapers and the committee",lead:"The word as a weapon.",
        p:["In June 1871 Botev became editor of the émigré newspaper Word of the Bulgarian Emigrants, where he printed his early poems. His ties with Russian revolutionaries cost him months in prison. He then worked on Lyuben Karavelov's newspaper Svoboda (Liberty), and in 1873 edited the satirical Budilnik (Alarm Clock), whose feuilletons stung the wealthy Bulgarians who stood aside from the revolutionary cause.",
           "At the end of 1872 the Ottoman authorities captured Levski, and in February 1873 he was hanged — a heavy blow to the movement. The Bulgarian Revolutionary Central Committee split: Botev, Stefan Stambolov and Panayot Hitov wanted an immediate uprising, while the moderates around Karavelov thought it too early. The 1875 revolt in Bosnia and Herzegovina strengthened Botev's belief that the hour had come.",
           "At the beginning of August 1875 the ailing Karavelov stepped down and Botev was elected president of the committee. That same year he married Veneta; they had a daughter, Ivanka.",
           "In his convictions Botev was a utopian socialist, shaped by Herzen, Bakunin, Chernyshevsky and the Paris Commune; he also read Marx and Engels in Russian translation. With Karavelov he was among the fiercest opponents of autocracy. In an 1875 article he allowed that Turks, too, could join the revolution beside the Bulgarians, since both suffered under the order of “sultans and capitalists”."],
        f:[["1871","Word of the Bulgarian Emigrants"],["1873","The satirical Budilnik"],["1875","President of the BRCC"]]},
      "/poetry":{nav:"Poetry",h:"Songs and Poems",lead:"Twenty poems, and enough for immortality.",
        p:["In 1875 Botev published his one and only book of verse, “Songs and Poems by Botev and Stambolov”, together with his comrade Stefan Stambolov, the future statesman. It is regarded as one of the greatest achievements of Bulgarian literature.",
           "His poems speak in the voice of the poor and the defiant, fighting for freedom against tyranny. Among them are “My Prayer”, “At Farewell”, “Hajduks”, “In the Tavern” and “Struggle”, the ballad “Hadzhi Dimitar”, dedicated to his fallen friend, and “The Hanging of Vasil Levski”. In “Elegy” (1870) he asks his people who rocks them in the cradle of slavery.",
           "Byron, Pushkin and Lermontov echo in his verse, and so do Bulgarian folk song and the poetry of Rakovski. Botev did not spare his fellow writers either: in one poem he attacks Petko Slaveykov and Ivan Vazov for their approach to literature and life.",
           "In his last years he gave up poetry for the cause. All twenty poems of the book have been translated into English by Thomas Butler, Peter Tempest and Christopher Buxton."],
        f:[["1870","“Elegy”"],["1875","His only book of verse"],["20","poems"]]},
      "/radetzky":{nav:"Radetzky",h:"The Radetzky and the Vratsa mountains",lead:"May 1876 — from the Danube to Okolchitsa.",
        p:["During the April Uprising of 1876 the experienced commander invited to lead a company from Romania refused, and Botev took command himself. Military expertise came from Nikola Voinovski. Before crossing the Danube, Botev wrote that he was in high spirits and his joy was boundless, because “My Prayer” was about to be fulfilled.",
           "The plan was bold: disguised as gardeners, the rebels boarded the Austro-Hungarian passenger steamer Radetzky in groups at the Romanian ports of Zimnicea, Turnu Măgurele, Corabia and Bechet. When the last group was aboard they drew their hidden weapons and seized the ship. The episode was later celebrated in the song “Still White Danube Undulates”.",
           "Once ashore, the company came under bashi-bazouk attack almost at once. On 18 May it took up position on Milin Kamak hill, some 50 km from the Danube. It became clear that no help would come from the local population.",
           "On the morning of 20 May (1 June, new style) bashi-bazouks and five companies of regular Ottoman troops advanced. The defence was split into two sectors, commanded by Voinovski and by Botev. That evening Botev was shot dead in the mountains near Vratsa, aged 28. It is not certain whether he fell at Okolchitsa or at Vola; a government commission in 1901 concluded it was Okolchitsa. After his death the company broke up."],
        f:[["May 1876","The steamer Radetzky"],["18 May","Milin Kamak"],["20 May","Botev killed, aged 28"]]},
      "/legacy":{nav:"Legacy",h:"Legacy",lead:"How a poet became an icon — and what is still argued over.",
        p:["In 1885 a committee was founded to commemorate the anniversary of his death, and in 1890 a monument to him was unveiled on the main square of Vratsa in the presence of Prince Ferdinand. Stefan Stambolov and his first biographer, Zahari Stoyanov, did much to shape his image; within a decade he was a central figure in the national pantheon.",
           "Not everyone accepted the cult uncritically. As early as 1891 Ivan Vazov worried that it rested on hot patriotic feeling and not on a sober estimate of his merits. In the twentieth century Botev was claimed from several sides — socialists, communists, anarchists — each seeing in him a forerunner. Historians describe him as an ardent patriot, a social revolutionary, and a man of harsh and difficult temper.",
           "The town of Botevgrad (since 1934), Botev Peak, the highest in the Balkan Mountains (since 1950), football clubs, schools and streets bear his name. His childhood home in Kalofer, destroyed in the war of 1877–1878, was rebuilt in the 1940s as the Hristo Botev National Museum. A monument has stood at Okolchitsa since 1939.",
           "His poems are taught in school and recited on anniversaries. On 2 June Botev and the men of his company are commemorated, and in Bulgarian National Television's “The Great Bulgarians” (2006–2007) he was ranked fifth."],

      "/early-life":{nav:"Early life",h:"Karlovo and the cassock",lead:"Tailor's apprentice, pupil, Deacon Ignatius.",
        p:["Levski was born on 18 July 1837 in Karlovo, then in the Ottoman Empire. His parents, Ivan Kunchev and Gina Kuncheva, née Karaivanova, came from families of clergy and craftsmen. He had an older sister, Yana, younger brothers Hristo and Petar, and a sister, Maria, who died in childhood. His father died in 1844.",

           "In November 1866 he visited Rakovski in Iaşi and was chosen as standard-bearer of Panayot Hitov's band. In April 1867 the band crossed the Danube at Tutrakan, moved through Ludogorie and reached the Balkan Mountains; in August, after skirmishes, it withdrew to Serbia through Pirot.",
           "In Belgrade Levski was a prominent member of the Second Bulgarian Legion. From February to April 1868 he was gravely ill with a gastric condition and underwent surgery. The legion was disbanded under political pressure, and he was briefly arrested in Zaječar. In the winter of 1868 he lived in an abandoned mill near Bucharest together with the poet Hristo Botev."],

        p:["From 11 December 1868 to 24 February 1869 Levski made his first tour of the Bulgarian lands: Plovdiv, Perushtitsa, Karlovo, Sopot, Kazanlak, Sliven, Tarnovo, Lovech, Pleven, Nikopol. From 1 May to 26 August 1869 he toured again, carrying proclamations from Ivan Kasabov and founding secret committees.",
           "From late August 1869 to May 1870 he was in Bucharest, where he made contact with Lyuben Karavelov and was among the founders of the Bulgarian Revolutionary Central Committee and the drafters of its statute.",
           "From the spring of 1870 he spent about a year and a half building the Internal Revolutionary Organisation, centred on Lovech. The network was densest in central Bulgaria — the Sofia, Plovdiv and Stara Zagora regions — and reached Macedonia, Dobruja and Strandzha. In the early 1870s it had just over a thousand members, mostly intellectuals and traders.",
           "In the autumn of 1871, with Angel Kanchev, he issued the “Instruction of the Workers for the Liberation of the Bulgarian People”. At the general assembly in Bucharest from 29 April to 4 May 1872 Karavelov was elected leader, and Levski was authorised to represent the committee in the Bulgarian lands."],
        f:[["1868–1869","Two tours of the country"],["1870","The Internal Revolutionary Organisation"],["1872","General assembly in Bucharest"]]},

        f:[["State","A democratic republic"],["Rights","Equality for all peoples and faiths"],["Opponent","The government, not the people"]]},
      "/capture":{nav:"Kakrina",h:"Kakrina and Sofia",lead:"From Arabakonak to the gallows.",
        p:["On 22 September 1872 his assistant Dimitar Obshti, acting without approval, robbed an Ottoman postal convoy in the Arabakonak pass and took 125,000 groschen for the organisation. Obshti and his men were soon arrested, and their confessions revealed the size of the organisation and its leaders.",

        f:[["22 Sept 1872","The Arabakonak robbery"],["27 Dec 1872","Arrested in Kakrina"],["18 Feb 1873","Hanged in Sofia"]]},
